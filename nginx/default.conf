# Development nginx config

upstream backend {
    server backend:8000;
}

# Main application: http://localhost:80
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;
    server_tokens off;

    location = /wpad.dat {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Hide Django admin on the main application port
    location = /admin {
        return 404;
    }

    location /admin/ {
        return 404;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    location /protected-media/ {
        internal;
        alias /home/app/backend/mediafiles/;
    }

    location / {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Django admin - development access only: http://localhost:8080/admin/
server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 20M;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    location /protected-media/ {
        internal;
        alias /home/app/backend/mediafiles/;
    }

    # Only expose the admin interface on this port
    location / {
        return 404;
    }
}
