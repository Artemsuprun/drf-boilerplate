upstream backend {
    server backend:8000;
    keepalive 16;
}

# HTTP: Let's Encrypt challenge + HTTPS redirect
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

# for the www
server {
    listen 443 ssl;
    http2 on;
    server_name www.${DOMAIN};

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    return 301 https://${DOMAIN}$request_uri;
}

# Public HTTPS application
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    server_tokens off;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml text/plain;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Hide Django admin from public access
    location = /admin {
        return 404;
    }

    location /admin/ {
        return 404;
    }

    location /static/ {
        alias /home/app/backend/staticfiles/;
        expires 30d;
    }

    location /protected-media/ {
        internal;
        alias /home/app/backend/mediafiles/;
    }

    location / {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_buffering on;
    }
}

# Private Django admin: https://<ADMIN_BIND_IP>:8080/admin/
server {
    listen 8080 ssl default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /static/ {
        alias /home/app/backend/staticfiles/;
        expires 30d;
    }

    location / {
        return 404;
    }
}
